<script type='text/javascript'>
    RED.nodes.registerType('price-timer',{
        category: 'function',
        color: '#a6bbcf',
        defaults: {
            name: {value: ''},
            prices: {
                value: '',
                required: false,
                validate: function (v) {
                    if (v === '' || v === undefined || v === null) {
                        return true;
                    }
                    try {
                        var parsed = typeof v === 'string' ? JSON.parse(v) : v;
                        return Array.isArray(parsed) || (parsed && Array.isArray(parsed.spotprice));
                    } catch (e) {
                        return false;
                    }
                }
            },
            hours: {
                value: 8,
                validate: function (v) {
                    if (v === '' || v === undefined || v === null) {
                        return true;
                    }
                    return RED.validators.number()(v);
                }
            },
            topic: {value: ''},
            startValue: {value: 'on'},
            stopValue: {value: 'off'},
            priceCap: {
                value: '',
                validate: function (v) {
                    if (v === '' || v === undefined || v === null) {
                        return true;
                    }
                    return RED.validators.number()(v);
                }
            },
            priceLevel: {
                value: '',
                validate: function (v) {
                    if (v === '' || v === undefined || v === null) {
                        return true;
                    }
                    return RED.validators.number()(v);
                }
            },
            minHours: {
                value: 0,
                validate: function (v) {
                    if (v === '' || v === undefined || v === null) {
                        return true;
                    }
                    return RED.validators.number()(v);
                }
            },
            timeSpan: {
                value: '',
                validate: function (v) {
                    if (v === '' || v === undefined || v === null) {
                        return true;
                    }
                    var match = /^\s*(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\s*$/.exec(String(v));
                    if (!match) {
                        return false;
                    }
                    function minutes(hour, minute) {
                        hour = Number(hour);
                        minute = Number(minute);
                        if (minute > 59 || hour > 24 || (hour === 24 && minute !== 0)) {
                            return null;
                        }
                        return hour * 60 + minute;
                    }
                    var from = minutes(match[1], match[2]);
                    var to = minutes(match[3], match[4]);
                    return from != null && to != null && from !== to && from !== 1440;
                }
            },
            onlyDuringSpan: {value: false},
            stopAtSpanEnd: {value: false}
        },
        inputs:1,
        outputs:2,
        icon: 'font-awesome/fa-money',
        label: function() {
            return this.name||'price-timer';
        },
        oneditprepare: function () {
            $('#node-input-prices').typedInput(
            {
                type:'json',
                types:['json'],
                typeField: '#node-input-prices-type',
                placeholder: 'uses msg.prices'
            })
            $('#node-input-hours').typedInput(
            {
                type:'num',
                types:['num'],
                typeField: '#node-input-hours-type',
                placeholder: 'uses msg.hours'
            })
            $('#node-input-startValue').typedInput(
            {
                type:'str',
                types:['str','num','bool','json','bin','jsonata','date','env'],
                typeField: '#node-input-startValue-type',
                placeholder: 'uses msg.startValue'
            })
            $('#node-input-stopValue').typedInput(
            {
                type:'str',
                types:['str','num','bool','json','bin','jsonata','date','env'],
                typeField: '#node-input-stopValue-type',
                placeholder: 'uses msg.stopValue'
            })
        }
    });
</script>

<script type='text/html' data-template-name='price-timer'>
    <div class='form-row'>
        <label for='node-input-name'><i class='fa fa-tag'></i> Name</label>
        <input type='text' id='node-input-name' placeholder='Name'>
    </div>

    <div class='form-row'>
        <label title='Optional prices. Leave empty to use msg.prices. If both are set, the message is used.' for='node-input-prices'><i class='fa fa-money'></i> Prices</label>
        <input type='text' id='node-input-prices' placeholder='uses msg.prices'>
        <input type='hidden' id='node-input-prices-type'>
    </div>
    <div class='form-row'>
        <label title='Topic for output 2. A value here overrides msg.topic. Leave empty to use msg.topic.' for='node-input-topic'><i class='fa fa-tasks'></i> Topic</label>
        <input type='text' id='node-input-topic' placeholder='uses msg.topic'>
    </div>
    <div class='form-row'>
        <label title='Demanded number of hours. Leave empty to use msg.hours. If both are set, the message is used.' for='node-input-hours'><i class='fa fa-clock-o'></i> Hours</label>
        <input type='number' id='node-input-hours' placeholder='uses msg.hours'>
    </div>
    <div class='form-row'>
        <label title='Only pick hours inside this range of the price day. Example: 08:00-16:00 with Hours 2 uses the 2 cheapest hours between 08:00 and 16:00. The end time is exclusive. A range that passes midnight, such as 22:00-06:00, is allowed. Leave empty to use the full day, or msg.timeSpan. If both are set, the message is used.' for='node-input-timeSpan'><i class='fa fa-clock-o'></i> Time span</label>
        <input type='text' id='node-input-timeSpan' placeholder='uses msg.timeSpan'>
    </div>
    <div class='form-row'>
        <label for='node-input-onlyDuringSpan'></label>
        <input type='checkbox' id='node-input-onlyDuringSpan' style='display:inline-block;width:auto;vertical-align:top;'>
        <label for='node-input-onlyDuringSpan' title='Send output 2 only while the current time is inside Time span. Outside that range, output 2 sends nothing, so other price-timer nodes can control the same load.' style='width:auto;'>Only during span</label>
    </div>
    <div class='form-row'>
        <label for='node-input-stopAtSpanEnd'></label>
        <input type='checkbox' id='node-input-stopAtSpanEnd' style='display:inline-block;width:auto;vertical-align:top;'>
        <label for='node-input-stopAtSpanEnd' title='Send the Off-value once on the first message after Time span ends, then stay silent outside the span when Only during span is enabled. Use this when the next span does not start immediately.' style='width:auto;'>Stop when span ends</label>
    </div>
    <div class='form-row'>
        <label title='Value sent on output 2 when the load should run. Leave empty to use msg.startValue. If both are set, the message is used.' for='node-input-startvalue'><i class='fa fa-sun-o'></i> On-value</label>
        <input type='text' id='node-input-startValue' placeholder='uses msg.startValue'>
        <input type='hidden' id='node-input-startValue-type'>
    </div>
    <div class='form-row'>
        <label title='Value sent on output 2 when the load should stop. Leave empty to use msg.stopValue. If both are set, the message is used.' for='node-input-stopvalue'><i class='fa fa-power-off'></i> Off value</label>
        <input type='text' id='node-input-stopValue' placeholder='uses msg.stopValue'>
        <input type='hidden' id='node-input-stopValue-type'>
    </div>
    <div class='form-row'>
        <label title='Maximum price at which the load may run. A value here overrides msg.priceCap. Leave empty to use msg.priceCap, or no cap if the message omits it. Same unit as the price series.' for='node-input-pricecap'><i class='fa fa-money'></i> Price cap</label>
        <input type='number' id='node-input-priceCap' placeholder='uses msg.priceCap'>
    </div>
    <div class='form-row'>
        <label title='If the price stays at or below this level for longer than Hours, the load runs for the whole time it is at or below the level. A value here overrides msg.priceLevel. Leave empty to use msg.priceLevel, or to run only the cheapest Hours if the message omits it.' for='node-input-pricelevel'><i class='fa fa-money'></i> Price level</label>
        <input type='number' id='node-input-priceLevel' placeholder='uses msg.priceLevel'>
    </div>
    <div class='form-row'>
        <label title='Minimum amount of hours that must be active. Overrides the price cap. Leave empty to use msg.minHours. If both are set, the message is used.' for='node-input-minhours'><i class='fa fa-clock-o'></i> Min. hours</label>
        <input type='number' id='node-input-minHours' placeholder='uses msg.minHours'>
    </div>
</script>


<script type='text/html' data-help-name='price-timer'>
    <p>Plans when a load should run from a 24-hour spot price series. <b>Only an input message produces an output</b>, so trigger the node at the times and frequency you need.</p>
    <h3>Inputs</h3>
    <dl class='message-properties'>
        <dt>prices <span class='property-type'>array | object</span></dt>
        <dd>A 24-hour price series (numeric array, or <code>{ spotprice: [...] }</code>). Prefer this over the optional Prices property on the node.</dd>
        <dt class='optional'>hours <span class='property-type'>number</span></dt>
        <dd>Used when Hours on the node is empty. If both are set, this message value is used.</dd>
        <dt class='optional'>timeSpan <span class='property-type'>string</span></dt>
        <dd>Used when Time span on the node is empty. A range such as <code>08:00-16:00</code> limits the schedule to samples fully inside that part of the price day. The end time is exclusive. <code>22:00-06:00</code> passes midnight. If both are set, this message value is used. If both are empty, the whole day is used.</dd>
        <dt class='optional'>tomorrowPrices <span class='property-type'>array | object</span></dt>
        <dd>Optional next-day price series in the same shape and length as <code>prices</code>. Used only when Time span crosses midnight. Samples that have already ended today take their price from this series when the next occurrence starts within 24 hours. The node remembers the series and, after midnight, compares it to the new <code>msg.prices</code>. A mismatch is logged as an error and the newest prices are used.</dd>
        <dt class='optional'>topic <span class='property-type'>string</span></dt>
        <dd>Used on output 2 when Topic on the node is empty. A Topic entered on the node overrides this.</dd>
        <dt class='optional'>startValue <span class='property-type'>any</span></dt>
        <dd>Sent as <code>msg.payload</code> on output 2 when the load should run, if On-value on the node is empty. If both are set, this message value is used.</dd>
        <dt class='optional'>stopValue <span class='property-type'>any</span></dt>
        <dd>Sent as <code>msg.payload</code> on output 2 when the load should stop, if Off-value on the node is empty. If both are set, this message value is used.</dd>
        <dt class='optional'>priceCap <span class='property-type'>number</span></dt>
        <dd>Used when Price cap on the node is empty. Same unit as the price series. If the node and the message both omit it, there is no cap. A Price cap entered on the node overrides this.</dd>
        <dt class='optional'>priceLevel <span class='property-type'>number</span></dt>
        <dd>Used when Price level on the node is empty. If the series stays at or below this level for longer than <code>hours</code>, the load runs for every sample at or below the level. If the node and the message both omit it, the load runs only for the cheapest Hours. A Price level entered on the node overrides this.</dd>
        <dt class='optional'>minHours <span class='property-type'>number</span></dt>
        <dd>Used when Min. hours on the node is empty. Forces that many hours even above the price cap. If both are set, this message value is used.</dd>
    </dl>

 <h3>Outputs</h3>
     <ol class='node-ports'>
         <li>Information output
             <dl class='message-properties'>
                 <dt>payload <span class='property-type'>object</span></dt>
                 <dd>Schedule details: prices, tomorrow prices when an overnight span used them, requested hours, time span, selected slots, hours below the price cap, hours below the price level, whether the schedule was extended, and start/stop windows.</dd>
             </dl>
         </li>
         <li>Control output
             <dl class='message-properties'>
                 <dt>payload <span class='property-type'>any</span></dt>
                 <dd>The On-value or Off-value for the current time. With <b>Only during span</b>, no message is sent while the current time is outside Time span. With <b>Stop when span ends</b>, the first message after the span ends sends the Off-value.</dd>
                 <dt>topic <span class='property-type'>string</span></dt>
                 <dd>The topic entered on the node, or <code>msg.topic</code> when that field is empty.</dd>
             </dl>
         </li>
     </ol>

<h3>Details</h3>
    <p>Topic, Price cap, and Price level entered on the node override the matching message properties. Leave those fields empty to use <code>msg.topic</code>, <code>msg.priceCap</code>, and <code>msg.priceLevel</code>.</p>
    <p>Prices, Hours, Time span, On-value, Off-value, and Min. hours still prefer the message when it is set, so existing flows that override those node settings keep working. Leave a field empty to take the value from the message. The editor shows <code>uses msg.…</code> in an empty field.</p>
    <p>Leave Time span empty to use the whole price day. When it is set, only samples that fall entirely inside the range are eligible. Hours, the price cap, the price level, and Min. hours then apply inside that range. <code>08:00-16:00</code> with Hours <code>2</code> runs the 2 cheapest hours between 08:00 and 16:00. If Hours is longer than the range, the schedule is limited to the range.</p>
    <p>When Time span crosses midnight and <code>msg.tomorrowPrices</code> is set, hours that have already ended today are priced from tomorrow if they start within the next 24 hours. Evening hours still use <code>msg.prices</code>. Daytime spans ignore tomorrow prices. After midnight the node checks that the remembered tomorrow series matches the new <code>msg.prices</code>. On a mismatch it logs an error and continues with the newest series.</p>
    <p><b>Only during span</b> limits output 2 to the time span. Outside it, that output sends nothing, so several price-timer nodes can share one load without turning each other off. Output 1 still sends the schedule. <b>Stop when span ends</b> sends the Off-value on the first message after the span ends. Enable it when the next span does not start straight away, so the load is turned off in the gap. Leave it off when spans meet, such as <code>08:00-16:00</code> and <code>16:00-08:00</code>, because the next node takes over.</p>
    <p>Leave Price cap empty for no limit. When set, samples above the cap are skipped unless Min. hours requires them. The cap uses the same unit as the price series.</p>
    <p>Leave Price level empty to always pick the cheapest hours. When it is set and the price is at or below that level for longer than Hours, every such sample is active, including samples above the price cap. If that stretch is not longer than Hours, the usual cheapest-hours schedule is used. Min. hours still forces extra cheapest samples if the extended stretch is shorter than that minimum.</p>

<h3>References</h3>
    <ul>
        <li><a href="https://github.com/nicke77/price-timer">GitHub</a> - the node repository</li>
    </ul>
</script>
